你好，我正在开发一个基于 ROS 2 Humble 的机器人遥控系统。我的控制器是 Steam Deck。目前的通信方式是局域网 Wi-Fi，但未来需要替换为无线通信模块的“串口网口透传”。

为了保证未来切换到串口时，代码修改量最小，我需要你用 Python 帮我编写一个解耦的 teleop_bridge ROS 2 软件包。请不要依赖 ROS 2 原生的跨设备 DDS 通信，而是将两端完全隔离，中间通过自定义的紧凑字节流进行数据传输。

需求详情：

1. 封包与解包协议 (必须极度紧凑，为未来串口低带宽做准备):

    使用 Python 的 struct 模块将摇杆数据打包。

    定义一个包含帧头 (例如 0x55 0xAA)、校验位、以及摇杆轴 (float32) 和按键状态 (位掩码 bitmask) 的紧凑结构体。

2. 节点 bridge_tx_node (运行在 Steam Deck):

    订阅标准话题 /joy (sensor_msgs/msg/Joy)。

    将 Joy 数据使用上面的协议序列化为字节流 (bytes)。

    目前阶段：使用 Python 的 socket 库，通过 UDP 将字节流发送到机器人的 IP 和指定端口。

    架构要求: 请把 UDP 发送逻辑封装成一个独立的类 (例如 UDPSender)，并在注释中说明未来如何在这里替换为 pyserial。

3. 节点 bridge_rx_node (运行在机器人端):

    启动一个 UDP 服务端，监听指定端口。

    接收到字节流后，根据帧头和校验位进行解包，过滤掉断连或错误数据。

    将解析出的数据还原为 sensor_msgs/msg/Joy 并发布到机器人本地的 /joy_remote 话题上。

4. Launch 文件支持:

    编写 steamdeck_bringup.launch.py: 启动官方的 joy_node 以及你写的 bridge_tx_node，允许通过参数传入目标机器人的 IP 地址。

    编写 robot_bringup.launch.py: 启动 bridge_rx_node，监听本地端口。

输出要求:

    给出 setup.py 的依赖配置。

    给出完整的节点 Python 代码（必须包含异常处理，比如 UDP 掉线不应导致节点崩溃）。

    给出两个 Launch 文件的代码。

    代码风格需符合 PEP8 和 ROS 2 最佳实践，提供详细的中文注释。