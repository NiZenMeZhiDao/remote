你好，我正在开发一个基于 ROS 2 Humble 的机器人遥控系统。我的控制器是 Steam Deck。通信方式无线通信模块的“串口网口透传”。

我需要你用 Python 帮我编写一个解耦的 teleop_bridge ROS 2 软件包。请不要依赖 ROS 2 原生的跨设备 DDS 通信，而是将两端完全隔离，中间通过自定义的紧凑字节流进行数据传输。

需求详情：

数据流
1. Steam Deck 端：读取摇杆输入数据，打包成紧凑的字节流，通过串口发送到机器人。
2. 机器人端：接收串口数据，解析成摇杆输入数据，并发布到 ROS 2 话题上供其他节点使用。
3. 双向通信：机器人端还需要将当前屏幕画面通过网口透传发送回 Steam Deck。


1. 封包与解包协议 (必须极度紧凑，为未来串口低带宽115200做准备):

    使用 Python 的 struct 模块将摇杆数据打包。

    定义一个包含帧头 (例如 0x55 0xAA)、校验位、以及摇杆轴 (float32) 和按键状态 (位掩码 bitmask) 的紧凑结构体。

2. 节点 bridge_tx_node (运行在 Steam Deck):

    订阅标准话题 /joy (sensor_msgs/msg/Joy)。

    将 Joy 数据使用上面的协议序列化为字节流 (bytes)。

    发送到串口

    网口接收机器人传回来的画面

3. 节点 bridge_rx_node (运行在机器人端):

    网口透传发送当前屏幕画面到 Steam Deck

    解析串口

    将解析出的数据还原为 sensor_msgs/msg/Joy 并发布到机器人本地的 /joy_remote 话题上。

4. Launch 文件支持:

    编写机器人端和 Steam Deck 端的 Launch 文件，分别启动 bridge_tx_node 和 bridge_rx_node，以及其他需要用到的其他组建

输出要求:

    给出 setup.py 的依赖配置。

    给出完整的节点 Python 代码（必须包含异常处理，比如 UDP 掉线不应导致节点崩溃）。

    给出两个 Launch 文件的代码。

    代码风格需符合 PEP8 和 ROS 2 最佳实践，提供详细的中文注释。

    顺便修改.vscode的tasks.json文件，适配当前仓库结构，方便开发和调试。基础包含编译、两端运行和显示topic内容debug。

    添加gitignaro文件，忽略编译产物和临时文件。

    介绍同步到readme文件，说明如何使用这个软件包，包括安装依赖、编译、运行节点和调试。